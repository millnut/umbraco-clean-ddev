name: umbraco-clean
type: generic
docroot: ""

# Based on: https://docs.umbraco.com/umbraco-cms/fundamentals/setup/install/running-umbraco-on-docker-locally
webserver_type: generic

# SQL Server runs as its own service below, so DDEV's MariaDB would only idle
omit_containers: [db]

# webimage_extra_packages is deliberately absent. DDEV injects it ahead of
# .ddev/web-build/Dockerfile, so it cannot see the Microsoft apt feed that
# Dockerfile registers.

# generic webserver_type emits no default web router, so without this block the
# site 404s. DDEV also builds the Traefik backend URL from http_port rather than
# container_port. A mismatched pair such as container_port 8080 with http_port 80
# therefore routes to :80 and returns 502. Keeping them equal avoids that.
web_extra_exposed_ports:
    - name: umbraco
      container_port: 80
      http_port: 80
      https_port: 443

# Runs under the web container's supervisord, which gives restart-on-failure for
# free. Overriding the compose command instead would displace DDEV's entrypoint.
web_extra_daemons:
    - name: umbraco
      command: "dotnet watch run --non-interactive --no-launch-profile"
      directory: /var/www/html/MyProject

web_environment:
    - ASPNETCORE_ENVIRONMENT=Development
    # The router reaches Kestrel across the docker network rather than loopback,
    # so this has to bind 0.0.0.0. Port 80 is where the router sends this project.
    - ASPNETCORE_URLS=http://0.0.0.0:80
    # The router terminates TLS and forwards plain HTTP, so without this Kestrel
    # mis-detects the scheme and generates http:// links
    - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    - DOTNET_CLI_TELEMETRY_OPTOUT=1
    # A cache under $HOME is lost whenever the container is recreated. This one
    # sits on a volume and survives.
    - NUGET_PACKAGES=/mnt/ddev-global-cache/nuget

# Umbraco brings its own configuration, so DDEV's generated php.ini and nginx.conf
# would only be dead files here
disable_settings_management: true
upload_dirs: []

use_dns_when_possible: true
composer_version: ""
nodejs_version: ""
disable_upload_dirs_warning: true
