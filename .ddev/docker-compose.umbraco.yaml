#ddev-silent-no-warn
# Based on: https://docs.umbraco.com/umbraco-cms/fundamentals/setup/install/running-umbraco-on-docker-locally

services:
  web:
    working_dir: /var/www/html/MyProject
    command:
      - bash
      - -c
      - |
        echo "=== Container Starting ==="
        pwd
        ls -la
        echo "=== Restoring packages ==="
        dotnet restore
        echo "=== Starting application ==="
        exec dotnet watch run --non-interactive --no-launch-profile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Must bind 0.0.0.0 — localhost won't be reachable from the DDEV router container
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      # DDEV's router terminates TLS and forwards via HTTP; Kestrel needs to trust X-Forwarded-* headers
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
      - DOTNET_CLI_TELEMETRY_OPTOUT=1
      - DOTNET_RUNNING_IN_CONTAINER=true
      # NuGet and dotnet CLI write to $HOME; the default user may not own /home, so use /tmp
      - HOME=/tmp
    volumes:
      - "${DDEV_APPROOT}:/var/www/html:cached"

  # Azure SQL Edge instead of SQL Server proper — same TDS protocol, but runs on ARM64/Apple Silicon
  sqlserver:
    container_name: ddev-${DDEV_SITENAME}-sqlserver
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=UmbracoD3v!
    ports:
      - "1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # python3 socket check because Azure SQL Edge doesn't ship sqlcmd
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.create_connection(('localhost',1433),2); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      # SQL Edge takes ~20s to initialise on first run
      start_period: 30s
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}

  adminer:
    depends_on:
      - sqlserver
    environment:
      - ADMINER_DEFAULT_DRIVER=mssql
      - ADMINER_DEFAULT_SERVER=sqlserver
      - ADMINER_DEFAULT_DB=UmbracoDb
      - ADMINER_DEFAULT_USERNAME=sa
      - ADMINER_DEFAULT_PASSWORD=UmbracoD3v!

volumes:
  sqlserver-data:
