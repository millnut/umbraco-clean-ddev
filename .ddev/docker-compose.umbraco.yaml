#ddev-silent-no-warn
# Based on: https://docs.umbraco.com/umbraco-cms/fundamentals/setup/install/running-umbraco-on-docker-locally
#
# Only the services DDEV doesn't provide, plus the ordering dependency on them.
# The web container is configured in config.yaml, so that DDEV owns its lifecycle
# rather than a compose override.

services:
  web:
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - Umbraco__CMS__WebRouting__UmbracoApplicationUrl=${DDEV_PRIMARY_URL}

  # Azure SQL Edge rather than SQL Server proper, which has no ARM64/Apple Silicon
  # image; the TDS protocol is the same, so Umbraco cannot tell the difference
  sqlserver:
    container_name: ddev-${DDEV_SITENAME}-sqlserver
    image: mcr.microsoft.com/azure-sql-edge:latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
    ports:
      - "1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # A raw socket check, because Azure SQL Edge ships no sqlcmd to query with.
      # It only proves the port is open, which happens slightly before the server
      # will accept logins. If boot-time login timeouts ever appear, grep
      # /var/opt/mssql/log/errorlog for 'ready for client connections' instead.
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.create_connection(('localhost',1433),2); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      # First run initialises system databases, which takes ~20s; without the
      # grace period the retries would exhaust before that finishes
      start_period: 30s
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}

  adminer:
    depends_on:
      - sqlserver
    environment:
      - ADMINER_DEFAULT_DRIVER=mssql
      - ADMINER_DEFAULT_SERVER=sqlserver
      - ADMINER_DEFAULT_DB=UmbracoDb
      - ADMINER_DEFAULT_USERNAME=sa
      - ADMINER_DEFAULT_PASSWORD=${MSSQL_SA_PASSWORD}

volumes:
  sqlserver-data:
